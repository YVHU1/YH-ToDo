<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Master</title>
    <style>
        :root {
            --background-opacity: 0.8;
            --background-color: #1a1a1a;
            --accent-color: #3b82f6;
            --text-color: #ffffff;
            --completed-color: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: transparent;
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: rgba(26, 26, 26, var(--background-opacity));
            backdrop-filter: blur(10px);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .title-bar {
            -webkit-app-region: drag;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .title {
            font-size: 14px;
            font-weight: 500;
        }

        .window-controls {
            -webkit-app-region: no-drag;
            display: flex;
            gap: 8px;
        }

        .window-control {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 12px;
            font-weight: bold;
            transition: transform 0.2s ease;
            line-height: 1;
            padding: 0;
            margin: 0;
            position: relative;
        }

        .window-control::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .minimize::before { 
            content: '-';
        }
        .close::before { 
            content: '×';
        }

        .minimize { 
            background-color: #fbbf24;
            color: #000;
        }
        .close { 
            background-color: #ef4444;
            color: #fff;
        }

        .window-control.pin { 
            background-color: transparent;
            color: #fff;
        }

        .window-control.pin::before { 
            content: '📌';
            font-size: 10px;
        }

        .window-control.pin.active { 
            background-color: #ef4444;
            transform: scale(0.7);
        }

        .window-control.pin.active::before { 
            content: '';
        }

        .toolbar {
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pending-count {
            font-size: 12px;
            color: var(--completed-color);
        }

        .checklist {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            transition: all 0.3s ease;
            position: relative;
        }

        .todo-item:hover .add-task-hint {
            opacity: 1;
        }

        .add-task-hint {
            position: absolute;
            right: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .checkbox.checked {
            background-color: var(--accent-color);
        }

        .checkbox.checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .todo-text {
            flex: 1;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .todo-text.completed {
            color: var(--completed-color);
            text-decoration: line-through;
        }

        .todo-time {
            font-size: 12px;
            color: var(--completed-color);
        }

        .control-bar {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-button {
            position: relative;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--accent-color);
            border: none;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 0;
            margin: 0;
        }

        .add-button:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            width: 120px;
            height: 64px;
        }

        .add-button:hover::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .add-button:hover .add-button-plus {
            opacity: 0;
        }

        .add-button-plus {
            transition: opacity 0.2s ease;
        }

        .add-button-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .add-button:hover .add-button-menu {
            opacity: 1;
        }

        .add-button-option {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .add-button-option:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .add-button-option:first-child {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .undo-button {
            padding: 6px 12px;
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 16px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .undo-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .settings-button {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            transition: transform 0.3s ease;
            font-size: 24px;
        }

        .settings-button:hover {
            transform: rotate(90deg);
        }

        .settings-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 30%;
            min-width: 300px;
            max-width: 400px;
            height: 30%;
            min-height: 300px;
            max-height: 400px;
            background-color: rgba(26, 26, 26, 0.95);
            padding: 16px;
            transition: transform 0.25s ease;
            z-index: 1000;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
        }

        .settings-panel.active {
            transform: translate(-50%, -50%) scale(1);
        }

        .settings-panel h3 {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background-color: rgba(26, 26, 26, 0.95);
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .settings-content {
            height: calc(100% - 40px);
            overflow-y: auto;
        }

        /* Global Scrollbar Styles */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .settings-close {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s ease;
        }

        .settings-close:hover {
            color: var(--accent-color);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }

        /* Settings Panel Styles */
        .setting-item {
            margin-bottom: 16px;
        }

        .setting-item label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-color);
        }

        .setting-item select {
            width: 100%;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            color: var(--text-color);
        }

        .setting-item input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
        }

        .setting-item input[type="color"] {
            width: 100%;
            height: 32px;
            padding: 0;
            border: none;
            border-radius: 4px;
            background: none;
            cursor: pointer;
        }

        .setting-item button {
            width: 100%;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            color: var(--text-color);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .setting-item button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .task-input {
            width: 100%;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            color: var(--text-color);
            margin-top: 8px;
        }

        .history-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 30%;
            min-width: 300px;
            max-width: 400px;
            height: 30%;
            min-height: 300px;
            max-height: 400px;
            background-color: rgba(26, 26, 26, 0.95);
            padding: 16px;
            transition: transform 0.25s ease;
            z-index: 1000;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
        }

        .history-panel.active {
            transform: translate(-50%, -50%) scale(1);
        }

        .history-panel h3 {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background-color: rgba(26, 26, 26, 0.95);
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            transition: all 0.3s ease;
        }

        .history-text {
            flex: 1;
            font-size: 14px;
            color: var(--completed-color);
            text-decoration: line-through;
        }

        .history-time {
            font-size: 12px;
            color: var(--completed-color);
        }

        .restore-button {
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 16px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px;
        }

        .restore-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .todo-item.completing {
            animation: completeAnimation 0.5s ease forwards;
        }

        @keyframes completeAnimation {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-20px);
                opacity: 0;
            }
        }

        .history-button {
            padding: 6px 12px;
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 16px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            height: 30px;
            display: flex;
            align-items: center;
        }

        .history-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .add-task-dialog {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 30%;
            min-width: 300px;
            max-width: 400px;
            background-color: rgba(26, 26, 26, 0.95);
            padding: 16px;
            transition: transform 0.25s ease;
            z-index: 1000;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .add-task-dialog.active {
            transform: translate(-50%, -50%) scale(1);
        }

        .add-task-dialog h3 {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-task-input {
            width: 100%;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            color: var(--text-color);
            margin-bottom: 16px;
        }

        .dialog-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .dialog-button {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dialog-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .dialog-button.confirm {
            background: var(--accent-color);
        }

        .dialog-button.confirm:hover {
            background: #2563eb;
        }

        .history-undo-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-undo-button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 16px;
            color: var(--text-color);
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .history-undo-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .history-undo-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .undo-icon {
            font-size: 14px;
        }

        .undo-count {
            font-size: 12px;
            color: var(--completed-color);
        }

        .undo-toolbar-button {
            padding: 6px 12px;
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 16px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            height: 30px;
        }

        .undo-toolbar-button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .undo-toolbar-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toggle-wrapper {
            display: flex;
            align-items: center;
            margin-top: 8px;
        }

        .toggle-wrapper input[type="checkbox"] {
            height: 0;
            width: 0;
            visibility: hidden;
            position: absolute;
        }

        .toggle {
            cursor: pointer;
            width: 50px;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            display: block;
            border-radius: 100px;
            position: relative;
        }

        .toggle:after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 90px;
            transition: 0.3s;
        }

        input:checked + .toggle {
            background: var(--accent-color);
        }

        input:checked + .toggle:after {
            left: calc(100% - 3px);
            transform: translateX(-100%);
        }

        .toolbar-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .empty-history-message {
            text-align: center;
            padding: 20px;
            color: var(--completed-color);
            font-style: italic;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="title-bar">
            <div class="title" id="appTitle">待办事项</div>
            <div class="window-controls">
                <div class="window-control pin" onclick="togglePin()" id="pinButton"></div>
                <div class="window-control minimize" onclick="window.electronAPI.minimize()"></div>
                <div class="window-control close" onclick="window.electronAPI.close()"></div>
            </div>
        </div>
        
        <div class="toolbar">
            <div class="pending-count" id="pendingCount">0 个待办事项</div>
            <div class="toolbar-buttons">
                <button class="undo-toolbar-button" id="undoToolbarButton" onclick="undoLastAction()">
                    <span class="undo-icon">↩</span> 撤回
                </button>
                <button class="history-button" onclick="toggleHistory()" id="historyButton">历史完成</button>
            </div>
        </div>
        
        <div class="checklist" id="checklist">
            <div class="todo-item">
                <div class="add-task-hint" onclick="showAddTaskDialog()">点击添加新任务</div>
            </div>
        </div>
        
        <div class="control-bar">
            <button class="settings-button" onclick="toggleSettings()">⚙</button>
            <button class="add-button" id="addButton">
                <span class="add-button-plus">+</span>
                <div class="add-button-menu">
                    <div class="add-button-option" onclick="showAddTaskDialog()">新建任务</div>
                    <div class="add-button-option" onclick="showAddTaskDialog(true)">连续新建任务</div>
                </div>
            </button>
        </div>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <h3>
            <span id="settingsTitle">设置</span>
            <button class="settings-close" onclick="closeSettings()">×</button>
        </h3>
        <div class="settings-content">
            <div class="setting-item">
                <label id="opacityLabel">透明度</label>
                <input type="range" min="0" max="100" value="80" onchange="updateOpacity(this.value)">
                <div class="opacity-value" style="text-align: right; margin-top: 4px; font-size: 12px;">80%</div>
            </div>
            <div class="setting-item">
                <label id="backgroundColorLabel">背景颜色</label>
                <input type="color" value="#1a1a1a" onchange="updateBackgroundColor(this.value)">
                <button onclick="applyBackgroundColor()" style="margin-top: 8px;" id="applyButton">应用</button>
            </div>
            <div class="setting-item">
                <label id="backgroundImageLabel">背景图片</label>
                <button onclick="selectBackgroundImage()" id="selectImageButton">选择图片</button>
                <button onclick="clearBackgroundImage()" id="clearImageButton" style="margin-top: 8px;">清除背景图片</button>
            </div>
            <div class="setting-item">
                <label id="languageLabel">语言</label>
                <select id="languageSelect" onchange="changeLanguage(this.value)">
                    <option value="zh-CN">中文</option>
                    <option value="en-US">English</option>
                </select>
            </div>
            <div class="setting-item">
                <label id="autoStartLabel">开机自启动</label>
                <div class="toggle-wrapper">
                    <input type="checkbox" id="autoStartToggle" onchange="toggleAutoStart(this.checked)">
                    <label for="autoStartToggle" class="toggle"></label>
                </div>
            </div>
        </div>
    </div>

    <div class="history-panel" id="historyPanel">
        <h3>
            <span id="historyTitle">历史完成</span>
            <button class="settings-close" onclick="closeHistory()">×</button>
        </h3>
        <div class="history-undo-bar">
            <button class="history-undo-button" id="historyUndoButton" onclick="undoLastAction()">
                <span class="undo-icon">↩</span> 撤回操作
            </button>
            <span class="undo-count" id="undoCount">0/10</span>
        </div>
        <div class="history-content" id="historyContent">
            <!-- History items will be rendered here -->
        </div>
    </div>

    <div class="add-task-dialog" id="addTaskDialog">
        <h3>
            <span id="addTaskTitle">添加新任务</span>
            <button class="settings-close" onclick="closeAddTaskDialog()">×</button>
        </h3>
        <input type="text" class="add-task-input" id="addTaskInput" placeholder="请输入任务名称">
        <div class="dialog-buttons">
            <button class="dialog-button" onclick="closeAddTaskDialog()">取消</button>
            <button class="dialog-button confirm" onclick="confirmAddTask()">确认</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="settings.js"></script>
    <script>
        // Initialize managers
        const settingsManager = new SettingsManager();
        
        // DOM elements
        const checklist = document.getElementById('checklist');
        const settingsPanel = document.getElementById('settingsPanel');
        const historyPanel = document.getElementById('historyPanel');
        const historyContent = document.getElementById('historyContent');
        const toast = document.getElementById('toast');
        const pendingCount = document.querySelector('.pending-count');
        const historyUndoButton = document.getElementById('historyUndoButton');
        const undoCountDisplay = document.getElementById('undoCount');
        
        // State
        let todos = [];
        let completedTodos = [];
        let currentLanguage = 'zh-CN';
        let translations = {};
        let actionHistory = []; // 存储操作历史
        const MAX_HISTORY = 10; // 最多保存10步操作
        
        // Check if electronAPI is available
        function checkElectronAPI() {
            if (!window.electronAPI) {
                console.error('electronAPI 不可用');
                return false;
            }
            return true;
        }
        
        // Load translations
        async function loadTranslations(lang) {
            try {
                const response = await fetch(`locales/${lang}.json`);
                translations = await response.json();
                applyTranslations();
            } catch (error) {
                console.error('Error loading translations:', error);
            }
        }
        
        // Apply translations
        function applyTranslations() {
            document.getElementById('appTitle').textContent = translations.app.title;
            document.getElementById('pendingCount').textContent = `0 ${translations.app.pending}`;
            document.getElementById('historyButton').textContent = translations.app.history;
            document.getElementById('historyTitle').textContent = translations.app.history;
            document.getElementById('settingsTitle').textContent = translations.settings.title;
            document.getElementById('opacityLabel').textContent = translations.settings.opacity;
            document.getElementById('backgroundColorLabel').textContent = translations.settings.backgroundColor;
            document.getElementById('backgroundImageLabel').textContent = translations.settings.backgroundImage;
            document.getElementById('languageLabel').textContent = translations.settings.language;
            document.getElementById('applyButton').textContent = translations.settings.apply;
            document.getElementById('selectImageButton').textContent = translations.settings.selectImage;
        }
        
        // Change language
        async function changeLanguage(lang) {
            currentLanguage = lang;
            await loadTranslations(lang);
            await settingsManager.saveSettings({ language: lang });
        }
        
        // Load todos on startup
        window.addEventListener('DOMContentLoaded', async () => {
            if (!checkElectronAPI()) {
                console.error('electronAPI 不可用');
                showToast('应用程序错误：API 不可用');
                return;
            }
            
            try {
                const settings = await window.electronAPI.getSettings();
                currentLanguage = settings.language || 'zh-CN';
                await loadTranslations(currentLanguage);
                
                // 设置自启动状态
                const autoStartToggle = document.getElementById('autoStartToggle');
                autoStartToggle.checked = settings.autoStart || false;
                
                todos = await window.electronAPI.getTodos();
                completedTodos = todos.filter(todo => todo.completed);
                todos = todos.filter(todo => !todo.completed);
                
                console.log('加载待办事项:', todos);
                renderTodos();
                renderHistory();
                updatePendingCount();
                updateUndoButton();
            } catch (error) {
                console.error('加载待办事项时出错:', error);
                showToast('加载待办事项失败');
            }
        });
        
        // Render todos
        function renderTodos() {
            checklist.innerHTML = '';
            
            // Render existing todos
            todos.forEach((todo, index) => {
                const todoItem = document.createElement('div');
                todoItem.className = 'todo-item';
                todoItem.innerHTML = `
                    <div class="checkbox" onclick="toggleTodo(${index})"></div>
                    <div class="todo-text">${todo.text}</div>
                    <div class="todo-time">${new Date(todo.createdAt).toLocaleString()}</div>
                `;
                checklist.appendChild(todoItem);
            });
            
            // Add new task hint at the bottom
            const newTaskItem = document.createElement('div');
            newTaskItem.className = 'todo-item';
            newTaskItem.innerHTML = `
                <div class="add-task-hint">${translations.app.addTask || "点击添加新任务"}</div>
            `;
            newTaskItem.onclick = () => showAddTaskDialog();
            checklist.appendChild(newTaskItem);
        }
        
        // Render history
        function renderHistory() {
            historyContent.innerHTML = '';
            
            // 过滤近两天的完成任务
            const twoDaysAgo = new Date();
            twoDaysAgo.setDate(twoDaysAgo.getDate() - 2);
            
            // 只显示近两天的已完成任务
            const recentCompletedTodos = completedTodos.filter(todo => {
                const todoDate = new Date(todo.createdAt);
                return todoDate >= twoDaysAgo;
            });
            
            if (recentCompletedTodos.length === 0) {
                const emptyMessage = document.createElement('div');
                emptyMessage.className = 'empty-history-message';
                emptyMessage.textContent = '近两天没有已完成的任务';
                historyContent.appendChild(emptyMessage);
                return;
            }
            
            recentCompletedTodos.forEach((todo, index) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <div class="history-text">${todo.text}</div>
                    <div class="history-time">${new Date(todo.createdAt).toLocaleString()}</div>
                    <button class="restore-button" onclick="restoreTodo(${completedTodos.indexOf(todo)})">恢复</button>
                `;
                historyContent.appendChild(historyItem);
            });
        }
        
        // Save current state to history
        function saveToHistory() {
            // 创建当前状态的深拷贝
            const currentState = {
                todos: JSON.parse(JSON.stringify(todos)),
                completedTodos: JSON.parse(JSON.stringify(completedTodos))
            };
            
            // 添加到历史记录
            actionHistory.unshift(currentState);
            
            // 限制历史记录数量
            if (actionHistory.length > MAX_HISTORY) {
                actionHistory.pop();
            }
            
            // 更新撤销按钮状态
            updateUndoButton();
        }
        
        // Update undo button state
        function updateUndoButton() {
            const historyCount = actionHistory.length;
            undoCountDisplay.textContent = `${historyCount}/10`;
            
            const undoToolbarButton = document.getElementById('undoToolbarButton');
            
            if (historyCount === 0) {
                if (historyUndoButton) {
                    historyUndoButton.disabled = true;
                    historyUndoButton.classList.add('disabled');
                }
                
                if (undoToolbarButton) {
                    undoToolbarButton.disabled = true;
                    undoToolbarButton.classList.add('disabled');
                }
            } else {
                if (historyUndoButton) {
                    historyUndoButton.disabled = false;
                    historyUndoButton.classList.remove('disabled');
                }
                
                if (undoToolbarButton) {
                    undoToolbarButton.disabled = false;
                    undoToolbarButton.classList.remove('disabled');
                }
            }
        }
        
        // Undo last action
        async function undoLastAction() {
            if (actionHistory.length === 0) {
                showToast('没有可撤销的操作');
                return;
            }
            
            // 获取上一个状态
            const previousState = actionHistory.shift();
            
            // 恢复状态
            todos = previousState.todos;
            completedTodos = previousState.completedTodos;
            
            // 保存到存储
            await window.electronAPI.saveTodos([...todos, ...completedTodos]);
            
            // 更新 UI
            renderTodos();
            renderHistory();
            updatePendingCount();
            updateUndoButton();
            
            showToast('已撤销上一步操作');
        }
        
        // Toggle todo completion
        async function toggleTodo(index) {
            // 保存当前状态到历史记录
            saveToHistory();
            
            const todo = todos[index];
            const todoItem = checklist.children[index];
            
            // Add animation class
            todoItem.classList.add('completing');
            
            // Wait for animation to complete
            setTimeout(async () => {
                todo.completed = true;
                completedTodos.unshift(todo);
                todos.splice(index, 1);
                
                await window.electronAPI.saveTodos([...todos, ...completedTodos]);
                renderTodos();
                renderHistory();
                updatePendingCount();
                showToast(translations.toast.taskCompleted);
            }, 500);
        }
        
        // Restore todo from history
        async function restoreTodo(index) {
            // 保存当前状态到历史记录
            saveToHistory();
            
            const todo = completedTodos[index];
            todo.completed = false;
            todos.unshift(todo);
            completedTodos.splice(index, 1);
            
            await window.electronAPI.saveTodos([...todos, ...completedTodos]);
            renderTodos();
            renderHistory();
            updatePendingCount();
            showToast(translations.toast.taskUndone);
        }
        
        // Toggle history panel
        function toggleHistory() {
            historyPanel.classList.toggle('active');
        }
        
        // Close history panel
        function closeHistory() {
            historyPanel.classList.remove('active');
        }
        
        // Show add task dialog
        function showAddTaskDialog(continuous = false) {
            const dialog = document.getElementById('addTaskDialog');
            const input = document.getElementById('addTaskInput');
            dialog.classList.add('active');
            input.value = '';
            input.focus();
            
            // Store continuous mode state
            input.dataset.continuous = continuous;
        }

        // Close add task dialog
        function closeAddTaskDialog() {
            const dialog = document.getElementById('addTaskDialog');
            dialog.classList.remove('active');
        }

        // Confirm add task
        async function confirmAddTask() {
            const input = document.getElementById('addTaskInput');
            const text = input.value.trim();
            const isContinuous = input.dataset.continuous === 'true';
            
            if (text) {
                try {
                    // 保存当前状态到历史记录
                    saveToHistory();
                    
                    const newTask = {
                        text: text,
                        completed: false,
                        createdAt: new Date().toISOString()
                    };
                    
                    // Add to todos array
                    todos.unshift(newTask);
                    
                    // Save to storage
                    const success = await window.electronAPI.saveTodos([...todos, ...completedTodos]);
                    
                    if (success) {
                        // Update UI
                        renderTodos();
                        renderHistory();
                        updatePendingCount();
                        showToast(translations.toast.taskAdded);
                        
                        if (!isContinuous) {
                            closeAddTaskDialog();
                        } else {
                            // Clear input for next task
                            input.value = '';
                            input.focus();
                        }
                    } else {
                        throw new Error('Failed to save task');
                    }
                } catch (error) {
                    console.error('Error adding task:', error);
                    showToast(translations.toast.error);
                }
            } else {
                if (!isContinuous) {
                    closeAddTaskDialog();
                }
            }
        }

        // Handle Enter key in add task input
        document.getElementById('addTaskInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                confirmAddTask();
            } else if (e.key === 'Escape') {
                closeAddTaskDialog();
            }
        });
        
        // Toggle settings panel
        function toggleSettings() {
            settingsPanel.classList.toggle('active');
        }
        
        // Close settings
        function closeSettings() {
            settingsPanel.classList.remove('active');
        }
        
        // Update pending count
        function updatePendingCount() {
            const pending = todos.filter(todo => !todo.completed).length;
            pendingCount.textContent = `${pending} ${translations.app.pending}`;
        }
        
        // Show toast message
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 添加自启动开关功能
        async function toggleAutoStart(enabled) {
            try {
                const settings = await window.electronAPI.getSettings();
                settings.autoStart = enabled;
                await window.electronAPI.saveSettings(settings);
                await window.electronAPI.setAutoStart(enabled);
                showToast(enabled ? '已设置开机自启动' : '已关闭开机自启动');
            } catch (error) {
                console.error('设置自启动时出错:', error);
                showToast('设置自启动失败');
            }
        }

        // Toggle window pin
        async function togglePin() {
            const pinButton = document.getElementById('pinButton');
            const isPinned = pinButton.classList.contains('active');
            
            try {
                await window.electronAPI.setAlwaysOnTop(!isPinned);
                pinButton.classList.toggle('active');
                showToast(isPinned ? '已取消置顶' : '已置顶');
            } catch (error) {
                console.error('切换置顶状态时出错:', error);
                showToast('切换置顶状态失败');
            }
        }

        // Update opacity
        async function updateOpacity(value) {
            const opacity = value / 100;
            document.querySelector('.opacity-value').textContent = `${value}%`;
            await settingsManager.saveSettings({ opacity });
        }

        // Update background color
        async function updateBackgroundColor(value) {
            await settingsManager.saveSettings({ backgroundColor: value });
        }

        // Apply background color
        async function applyBackgroundColor() {
            const colorInput = document.querySelector('input[type="color"]');
            await updateBackgroundColor(colorInput.value);
            showToast('背景颜色已更新');
        }

        // Select background image
        async function selectBackgroundImage() {
            try {
                const imagePath = await window.electronAPI.selectBackgroundImage();
                if (imagePath) {
                    const appContainer = document.querySelector('.app-container');
                    // Convert Windows path to file URL
                    const fileUrl = `file:///${imagePath.replace(/\\/g, '/')}`;
                    await settingsManager.saveSettings({ 
                        backgroundImage: fileUrl,
                        backgroundSize: 'cover'
                    });
                    showToast('背景图片已更新');
                }
            } catch (error) {
                console.error('Error setting background image:', error);
                showToast('设置背景图片失败');
            }
        }

        // Clear background image
        async function clearBackgroundImage() {
            try {
                await settingsManager.saveSettings({ 
                    backgroundImage: null,
                    backgroundSize: 'cover'
                });
                showToast('已清除背景图片');
            } catch (error) {
                console.error('Error clearing background image:', error);
                showToast('清除背景图片失败');
            }
        }
    </script>
</body>
</html>
